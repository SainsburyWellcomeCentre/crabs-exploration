[project]
name = "crabs"
authors = [
    { email = "n.aznan@ucl.ac.uk", name = "Nik Khadijah Nik Aznan" },
    { email = "s.minano@ucl.ac.uk", name = "Sofia Minano" },
]
description = "A toolkit for detecting and tracking crabs in the field."
readme = "README.md"
requires-python = ">=3.12.0"
dynamic = ["version"]

license = { text = "BSD-3-Clause" }
urls.homepage = "https://github.com/SainsburyWellcomeCentre/crabs-exploration"

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX",
    "License :: OSI Approved :: BSD License",
]
dependencies = [
    "opencv-python",
    "sleap[nn]",  # works with python>3.11
    "typer",
    "timecode",
    "torch",
    "torchvision",
    "pycocotools",
    "filterpy",
    "lightning==2.5.0", # see https://github.com/Lightning-AI/pytorch-lightning/pull/20669
    "mlflow",
    "optuna",
    "numpy>=2.0.0",
    "movement>=0.17.0", # dimensions renamed to singular (individual, keypoint)
    "dask",
    "numba>=0.60.0",
    # numba is not used directly: movement pulls it in via xarray[accel].
    # Pinned to avoid a resolver conflict between movement and sleap-nn
    # (>=0.60 is also the first numba release that supports numpy 2).
    "zarr>=3",  # sharding
    "xarray",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "coverage",
    "tox",
    "mypy",
    "pre-commit",
    "ruff",
    "setuptools_scm",
    "check-manifest",
    "pooch",
    "tqdm",
    # "codespell",
    # "pandas-stubs",
    # "types-attrs",
    # "types-PyYAML",
    # "types-requests",
]
notebooks = [
    "ipympl",
    # for html figures of trajectories via notebooks/crabs_dataset:
    "plotly",
    "datashader",
]
# "masks" extra is required for mask-tracked-crabs.
# - SAM2 is pinned to a git commit because it is not on PyPI (this means
#   `crabs` cannot be published to PyPI).
# - We include huggingface_hub because SAM2 downloads its checkpoints with it
#   but does not declare it.
# - SAM2's build imports `torch`, so install `crabs` (and `setuptools`) first,
#   then uv-pip-install `crabs[masks]` with `--no-build-isolation-package sam-2`, so
#   that SAM2 builds against the `torch` already in the environment
#   (see bash_scripts/run_mask_array.sh).
masks = [
    "huggingface_hub",
    "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]

[project.scripts]
extract-frames = "crabs.bboxes_labelling.extract_frames_to_label_w_sleap:app_wrapper"
combine-annotations = "crabs.bboxes_labelling.combine_and_format_annotations:app_wrapper"
train-detector = "crabs.detector.train_model:app_wrapper"
evaluate-detector = "crabs.detector.evaluate_model:app_wrapper"
detect-and-track-video = "crabs.tracker.track_video:app_wrapper"
mask-tracked-crabs = "crabs.mask.mask_video:app_wrapper"
# support scripts
create-zarr-dataset = "crabs.zarr.create_dataset:app_wrapper"

[tool.uv]
# build SAM2 against the environment's torch rather than a second one.
# Only relevant for a uv-managed local environment, installed from a
# checkout of this repo with `uv sync --extra masks`. pip ignores it, and
# so does uv when installing crabs from git (as in bash_scripts/run_mask_array.sh).
no-build-isolation-package = ["sam-2"]

[build-system]
requires = ["setuptools>=77", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["crabs*"]
exclude = ["tests"]

[tool.pytest.ini_options]
addopts = "--cov=crabs"
# repo root on sys.path so tests can import the standalone scripts/ modules
pythonpath = ["."]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.mypy]
# scripts/ holds standalone (PEP 723) modules that tests import as
# scripts.* (mirrors the pytest pythonpath above). Treat the repo root as
# the package base so mypy derives the same module name from the file and
# from the import, instead of seeing one source file under two names.
explicit_package_bases = true

[tool.setuptools_scm]

[tool.check-manifest]
ignore = [
    ".yaml",
    "tox.ini",
    "tests/",
    "tests/test_unit/",
    "tests/test_integration/",
]

[tool.ruff]
line-length = 79
exclude = ["__init__.py", "build", ".eggs"]
fix = true

[tool.ruff.lint]
# See https://docs.astral.sh/ruff/rules/
ignore = [
    "D203", # one blank line before class
    "D213", # multi-line-summary second line
]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "UP",     # pyupgrade
    "I",      # isort
    "B",      # flake8 bugbear
    "SIM",    # flake8 simplify
    "C90",    # McCabe complexity
    "D",      # pydocstyle
    "NPY201", # checks for syntax that was deprecated in numpy2.0
]
per-file-ignores = { "tests/*" = [
    "D100", # missing docstring in public module
    "D205", # missing blank line between summary and description
    "D103", # missing docstring in public function
], "examples/*" = [
    "B018", # Found useless expression
    "D103", # Missing docstring in public function
    "D400", # first line should end with a period.
    "D415", # first line should end with a period, question mark...
    "D205", # missing blank line between summary and description
] }

[tool.ruff.format]
docstring-code-format = true # Also format code in docstrings


[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py{312,313}
isolated_build = True

[gh-actions]
python =
    3.12: py312
    3.13: py313

[testenv]
extras =
    dev
commands =
    pytest -v --color=yes --cov=crabs --cov-report=xml {posargs}
"""
# {posargs} allows parameters to get to pytest
