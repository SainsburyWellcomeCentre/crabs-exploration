name: tests

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:

jobs:
  linting:
    name: Run pre-commit linters
    runs-on: ubuntu-latest
    steps:
      - uses: neuroinformatics-unit/actions/lint@v3

  manifest:
    name: Check Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: neuroinformatics-unit/actions/check_manifest@v3

  test:
    name: Run tests on ${{ matrix.os }} py${{ matrix.python-version }}
    needs: [linting, manifest]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Run all supported Python versions on linux
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        include:
          - os: macos-latest  # Apple chip macOS
            python-version: "3.13"
    steps:
      - name: Cache test data
        uses: actions/cache@v6
        with:
          path: |
            ~/.crabs-exploration-test-data/*
          key: cached-test-data
          enableCrossOsArchive: true
      # Install necessary OpenGL packages for Ubuntu only
      # https://github.com/conda-forge/opencv-feedstock/issues/401
      # https://github.com/talmolab/sleap/pull/1909
      - name: Install OpenGL libraries (Ubuntu only)
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: |
          sudo apt-get update
          sudo apt-get install libegl-mesa0 libegl1 libopengl0 libgl1
      - name: Run all tests
        uses: neuroinformatics-unit/actions/test@v3
        with:
          python-version: ${{ matrix.python-version }}
          secret-codecov-token: ${{ secrets.CODECOV_TOKEN }}

  # SAM2 is in the "masks" extra, which the test job does not install
  # (its build needs torch installed first), so the SAM2 tests are
  # skipped there. This job installs it and runs them.
  test_sam2:
    name: Run SAM2 tests
    needs: [linting, manifest]
    runs-on: ubuntu-latest
    env:
      # CPU-only torch wheels: much smaller than PyPI's default CUDA ones
      UV_TORCH_BACKEND: cpu
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          activate-environment: true
      # opencv needs these on Ubuntu, as in the test job
      - name: Install OpenGL libraries
        run: |
          sudo apt-get update
          sudo apt-get install libegl-mesa0 libegl1 libopengl0 libgl1
      # as in bash_scripts/run_mask_array.sh: install torch (and setuptools)
      # first, then build SAM2 against them without build isolation
      - name: Install crabs, then SAM2
        run: |
          uv pip install -e ".[dev]" setuptools
          uv pip install --no-build-isolation-package sam-2 -e ".[dev,masks]"
      - name: Run SAM2 tests
        run: |
          # fail here, rather than skip the tests, if SAM2 did not install
          python -c "import sam2"
          pytest tests/test_unit/test_mask_video.py -k matches_sam2_predict

  # napari and pytest-qt are not dev dependencies, so the napari GUI tests
  # are skipped in the test job. This job installs them and runs the tests
  # with a virtual display.
  test_gui:
    name: Run napari GUI tests
    needs: [linting, manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          activate-environment: true
      # Qt, OpenGL and a virtual X display for napari
      - name: Install display libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libopengl0 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0
      # napari pinned as in the uv header of
      # scripts/orientation/annotate_crabs_orientation_manual.py:
      # change both together
      - name: Install crabs, napari and pytest-qt
        run: uv pip install -e ".[dev]" "napari[pyqt6]==0.9.2" pytest-qt
      - name: Run GUI tests
        # crabs depends on sleap, which installs PySide6: make qtpy use
        # PyQt6, as the labellers' environment does
        env:
          QT_API: pyqt6
        run: |
          # fail here, rather than skip the tests, if napari did not install
          python -c "import napari, pytestqt, qtpy; assert qtpy.API == 'pyqt6'"
          xvfb-run -a pytest -m gui tests/test_gui

  build_sdist_wheels:
    name: Build source distribution
    needs: [test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    steps:
      - uses: neuroinformatics-unit/actions/build_sdist_wheels@v3
